[project]
name = "ai-youtube-factory-shared"
version = "0.1.0"
description = "AI YouTube Factory — shared Python constants, enums, and utilities"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ayf_shared"]
