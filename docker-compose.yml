# AI YouTube Factory — full local stack.
#
#   docker compose up
#
# Starts PostgreSQL, Redis, RabbitMQ, the FastAPI backend, the Celery worker,
# and the Next.js frontend + admin apps. Health checks gate service start-up so
# dependent services only boot once their dependencies are ready.
#
# Prometheus and Grafana are behind a profile:
#
#   docker compose --profile observability up

name: ai-youtube-factory

x-backend-env: &backend-env
  ENVIRONMENT: development
  LOG_JSON: "true"
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_youtube_factory
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_youtube_factory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_youtube_factory"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ayf]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ayf]

  # S3-compatible object storage for local development. The same provider code
  # serves AWS S3 and Cloudflare R2 in deployed environments.
  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ayf]

  rabbitmq:
    # RabbitMQ 3.13 (LTS) is the compatible pairing for Celery: 4.x disables the
    # `transient_nonexcl_queues` feature Celery's internal queues depend on.
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks: [ayf]

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [ayf]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [ayf]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_ENV: development
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks: [ayf]

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_ENV: development
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    depends_on:
      - backend
    networks: [ayf]

  # -- Observability ---------------------------------------------------------
  # Behind a profile, so `docker compose up` stays the application stack:
  #
  #   docker compose --profile observability up
  #
  # Prometheus on :9090, Grafana on :3002 (admin/admin) with the datasource and
  # dashboards already provisioned.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [ayf]

  grafana:
    image: grafana/grafana:11.5.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Local-only convenience: the dashboards carry no secrets, and requiring
      # a login to read a development dashboard helps nobody.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # 3000 and 3001 are the frontend and admin apps.
      - "${GRAFANA_PORT:-3002}:3000"
    depends_on:
      prometheus: { condition: service_healthy }
    networks: [ayf]

networks:
  ayf:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:
